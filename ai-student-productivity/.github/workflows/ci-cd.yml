# ============================================================
# GitHub Actions CI/CD Pipeline — AI Student Productivity
# Runs: lint → unit tests → integration tests → docker build
# Deploy step removed (uses Render auto-deploy from main)
# ============================================================
name: CI — AI Student Productivity

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:

  # ── Lint + Test ───────────────────────────────────────────
  test:
    name: 🧪 Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || true     # non-blocking for now

      - name: Unit tests
        run: npm run test:unit
        env:
          NODE_ENV: test
          DATA_DIR: /tmp/test-data-unit

      - name: Integration tests
        run: npm run test:int
        env:
          NODE_ENV: test
          DATA_DIR: /tmp/test-data-int

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # ── Docker build (validates Dockerfile) ──────────────────
  docker:
    name: 🐳 Docker Build Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: studyai:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── Render auto-deploys on push to main ──────────────────
  # No manual deploy step needed — Render watches this repo
  # and deploys automatically when main branch is updated.
