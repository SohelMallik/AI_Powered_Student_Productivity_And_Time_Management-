# ============================================================
# GitHub Actions CI/CD Pipeline
# ============================================================
name: CI/CD – AI Student Productivity

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  AWS_REGION:   us-east-1
  APP_NAME:     ai-student-productivity
  NODE_VERSION: '20'

jobs:

  # ── 1. Lint & Test ──────────────────────────────────────────
  test:
    name: 🧪 Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || true

      - name: Run tests
        run: npm test -- --ci --coverage
        env:
          NODE_ENV: test
          DATA_DIR: /tmp/test-data

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: always()
        with:
          directory: ./coverage

  # ── 2. Build Docker image ───────────────────────────────────
  build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.APP_NAME }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          outputs: type=docker,dest=/tmp/${{ env.APP_NAME }}.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v3
        with:
          name: docker-image
          path: /tmp/${{ env.APP_NAME }}.tar
          retention-days: 1

  # ── 3. Deploy to Staging ─────────────────────────────────────
  deploy-staging:
    name: 🚀 Deploy – Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download Docker image
        uses: actions/download-artifact@v3
        with:
          name: docker-image
          path: /tmp

      - name: Load and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG:    ${{ needs.build.outputs.image-tag }}
        run: |
          docker load --input /tmp/${{ env.APP_NAME }}.tar
          docker tag ${{ env.APP_NAME }}:${IMAGE_TAG} ${ECR_REGISTRY}/${{ env.APP_NAME }}:${IMAGE_TAG}
          docker tag ${{ env.APP_NAME }}:${IMAGE_TAG} ${ECR_REGISTRY}/${{ env.APP_NAME }}:staging
          docker push ${ECR_REGISTRY}/${{ env.APP_NAME }}:${IMAGE_TAG}
          docker push ${ECR_REGISTRY}/${{ env.APP_NAME }}:staging

      - name: Deploy to staging
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          chmod +x aws/deploy.sh
          GITHUB_SHA=${IMAGE_TAG} ./aws/deploy.sh staging

  # ── 4. Deploy to Production ──────────────────────────────────
  deploy-production:
    name: 🌐 Deploy – Production
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url:  https://your-app.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download Docker image
        uses: actions/download-artifact@v3
        with:
          name: docker-image
          path: /tmp

      - name: Load and push image to production
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG:    ${{ needs.build.outputs.image-tag }}
        run: |
          docker load --input /tmp/${{ env.APP_NAME }}.tar
          docker tag ${{ env.APP_NAME }}:${IMAGE_TAG} ${ECR_REGISTRY}/${{ env.APP_NAME }}:${IMAGE_TAG}
          docker tag ${{ env.APP_NAME }}:${IMAGE_TAG} ${ECR_REGISTRY}/${{ env.APP_NAME }}:latest
          docker push ${ECR_REGISTRY}/${{ env.APP_NAME }}:${IMAGE_TAG}
          docker push ${ECR_REGISTRY}/${{ env.APP_NAME }}:latest

      - name: Deploy to production
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          chmod +x aws/deploy.sh
          GITHUB_SHA=${IMAGE_TAG} ./aws/deploy.sh production

      - name: Notify deployment
        if: success()
        run: echo "✅ Production deployment successful! Tag: ${{ needs.build.outputs.image-tag }}"
