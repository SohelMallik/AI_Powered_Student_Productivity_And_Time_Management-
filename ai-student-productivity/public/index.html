<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Student Productivity Assistant</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
</head>
<body>
  <!-- ── Sidebar ──────────────────────────────────────────── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <svg class="brand-icon" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="16" fill="#3b82d4"/>
        <path d="M10 22 L16 10 L22 22 M13 18 H19" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <span class="brand-name">StudyAI</span>
    </div>
    <nav class="sidebar-nav">
      <a href="#dashboard"   class="nav-item active" data-page="dashboard">
        <span class="nav-icon">⊞</span><span>Dashboard</span>
      </a>
      <a href="#tasks"       class="nav-item" data-page="tasks">
        <span class="nav-icon">✓</span><span>Tasks</span>
      </a>
      <a href="#schedule"    class="nav-item" data-page="schedule">
        <span class="nav-icon">⊙</span><span>Schedule</span>
      </a>
      <a href="#study"       class="nav-item" data-page="study">
        <span class="nav-icon">⏱</span><span>Study Tracker</span>
      </a>
      <a href="#semester"    class="nav-item" data-page="semester">
        <span class="nav-icon">📅</span><span>Semester Planner</span>
      </a>
      <a href="#analytics"   class="nav-item" data-page="analytics">
        <span class="nav-icon">📊</span><span>Analytics</span>
      </a>
      <a href="#ai-insights" class="nav-item" data-page="ai-insights">
        <span class="nav-icon">🤖</span><span>AI Insights</span>
      </a>
      <a href="#settings"    class="nav-item" data-page="settings">
        <span class="nav-icon">⚙</span><span>Settings</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="streak-badge" id="streakBadge">
        <span class="streak-fire">🔥</span>
        <span id="streakCount">0</span> day streak
      </div>
    </div>
  </aside>

  <!-- ── Main ─────────────────────────────────────────────── -->
  <main class="main-content" id="mainContent">
    <!-- Top bar -->
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">☰</button>
      <div class="topbar-title" id="topbarTitle">Dashboard</div>
      <div class="topbar-actions">
        <button class="btn btn-primary btn-sm" id="analyzeBtn">🤖 Run AI Analysis</button>
        <div class="user-avatar" id="userAvatar">S</div>
      </div>
    </header>

    <!-- Pages -->
    <div class="page active" id="page-dashboard">
      <div id="dashboard-root"></div>
    </div>
    <div class="page" id="page-tasks">
      <div id="tasks-root"></div>
    </div>
    <div class="page" id="page-schedule">
      <div id="schedule-root"></div>
    </div>
    <div class="page" id="page-study">
      <div id="study-root"></div>
    </div>
    <div class="page" id="page-semester">
      <div id="semester-root"></div>
    </div>
    <div class="page" id="page-analytics">
      <div id="analytics-root"></div>
    </div>
    <div class="page" id="page-ai-insights">
      <div id="ai-root"></div>
    </div>
    <div class="page" id="page-settings">
      <div id="settings-root"></div>
    </div>
  </main>

  <!-- ── Global Modal ─────────────────────────────────────── -->
  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="modal" id="globalModal">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">Modal</h3>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- ── Toast ────────────────────────────────────────────── -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ── Scripts ──────────────────────────────────────────── -->
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/chart.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/tasks.js"></script>
  <script src="js/pages/schedule.js"></script>
  <script src="js/pages/study.js"></script>
  <script src="js/pages/semester.js"></script>
  <script src="js/pages/analytics.js"></script>
  <script src="js/pages/aiInsights.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
