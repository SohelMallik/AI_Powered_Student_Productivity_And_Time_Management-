services:
  - type: web
    name: studyai-productivity
    env: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: POMODORO_WORK_MINUTES
        value: 25
      - key: POMODORO_BREAK_MINUTES
        value: 5
      - key: PROCRASTINATION_THRESHOLD_MINUTES
        value: 30
