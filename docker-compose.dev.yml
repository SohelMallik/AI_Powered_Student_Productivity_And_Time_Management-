# ============================================================
# Docker Compose Override – Development
# ============================================================
version: '3.9'

services:
  app:
    build:
      target: builder
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
    command: ["npx", "nodemon", "server/index.js"]
    ports:
      - "3000:3000"
      - "9229:9229"   # Node.js debugger

  # Dev: no Nginx, use app directly
  nginx:
    profiles: ["prod-only"]
